name: release

# Manual only: Actions -> release -> Run workflow. Wraps `bun run release` on the self-hosted Mac.
# Needs docs/releases/vX.Y.Z.md committed first (the script stops and drafts one if missing).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch | minor | major | current | X.Y.Z"
        required: true
        default: patch
      dry_run:
        description: "build + verify only, publish nothing"
        type: boolean
        default: true
      resume:
        description: "finish a release whose tag is already on origin (bun run release --resume)"
        type: boolean
        default: false
      from_tag:
        description: "build + publish the existing tag vVERSION (version = X.Y.Z) instead of main; implies resume"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    name: "Surffish · Release · mac build · ${{ inputs.from_tag && format('v{0} from tag', inputs.version) || (inputs.version && (startsWith(inputs.version, '0') || startsWith(inputs.version, '1') || startsWith(inputs.version, '2')) && format('v{0}', inputs.version)) || inputs.version || 'patch' }}${{ inputs.resume && ' · resume' || '' }}${{ inputs.dry_run && ' · dry run' || '' }}"
    runs-on: [self-hosted, macOS, ARM64]
    env:
      SURFFISH_GH_PROXY: socks5h://127.0.0.1:1088
    timeout-minutes: 60
    outputs:
      version: ${{ steps.released.outputs.version }}
    steps:
      - name: Checkout main (plain git)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # The mac job pins SURFFISH_GH_PROXY to the shared listener at 127.0.0.1:1088,
        # overriding stale runner .env state. The Mac's direct route 403s token writes, and
        # HTTP(S)_PROXY isn't always in the runner's env; release.ts uses the same proxy.
        run: |
          trap 'echo "::error title=Checkout main::git fetch from GitHub failed (route: $([ -n "${SURFFISH_GH_PROXY:-}" ] && echo SURFFISH_GH_PROXY || { [ -n "${HTTPS_PROXY:-}" ] && echo HTTPS_PROXY || echo direct; })), see the log above"' ERR
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git init -q .
          if [ -n "${SURFFISH_GH_PROXY:-}" ]; then
            git config http.https://github.com/.proxy "$SURFFISH_GH_PROXY"
            echo "git -> github.com through SURFFISH_GH_PROXY ($(printf %s "$SURFFISH_GH_PROXY" | sed -E 's#//[^/@]*@#//***@#'))"
          else
            git config --unset-all http.https://github.com/.proxy || true
            if [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ]; then echo "git -> github.com via HTTPS_PROXY from the runner env"; else echo "git -> github.com direct (no SURFFISH_GH_PROXY / HTTPS_PROXY)"; fi
          fi
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$url" || git remote add origin "$url"
          git fetch -q --tags origin main
          # the work dir persists between runs; an old shallow checkout breaks --resume's ancestry check
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch -q --unshallow --tags origin main; fi
          git checkout -q --force -B main origin/main
          git clean -qffdx -e node_modules
      - name: Bun (pinned to .bun-version, installed into ~/.bun if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$HOME/.bun/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
      - name: Preflight - can this runner push to GitHub? (git push --dry-run, before the build)
        run: bash scripts/ci/explain.sh "Preflight - GitHub push access" bash scripts/ci/github-preflight.sh
      - name: Bun only, no Node.js (node -> bun shim, runner externals/node* off PATH)
        run: bash scripts/ci/bun-as-node.sh
      - name: bun install (fails if any Node.js process runs)
        run: bash scripts/ci/explain.sh "bun install" bash scripts/ci/bun-install-mac.sh
      - name: Git identity for the release commit + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check the GitHub API route (SURFFISH_GH_PROXY, else fish ghp)
        # The Mac's network blocks non-enterprise GitHub API tokens on the direct route. The mac
        # job pins SURFFISH_GH_PROXY to the shared listener at 127.0.0.1:1088; release.ts makes
        # REST calls through it with the workflow token.
        run: |
          if [ -n "${SURFFISH_GH_PROXY:-}" ]; then echo "SURFFISH_GH_PROXY present: yes (release.ts checks the API through it)"; exit 0; fi
          echo "SURFFISH_GH_PROXY not set, falling back to fish ghp"
          command -v gh || { echo "::error::set SURFFISH_GH_PROXY in the runner .env, or install gh + fish ghp"; exit 1; }
          command -v fish || { echo "::error::set SURFFISH_GH_PROXY in the runner .env, or install fish + ghp"; exit 1; }
          fish -c 'functions -q ghp' || { echo "::error::set SURFFISH_GH_PROXY in the runner .env, or add a ghp fish function for the runner user"; exit 1; }
      - name: bun run release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESUME: ${{ inputs.resume }}
          FROM_TAG: ${{ inputs.from_tag }}
          # only release.ts's own curl calls use it (named so electron-builder can't pick it up to publish)
          SURFFISH_GH_TOKEN: ${{ github.token }}
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          flags="--yes"
          [ "$DRY_RUN" = "true" ] && flags="$flags --dry-run"
          [ "$RESUME" = "true" ] && flags="$flags --resume"
          [ "$FROM_TAG" = "true" ] && flags="$flags --resume --from-tag"
          # failures end with a one-line ::error annotation + step summary line (scripts/ci/failure-reason.ts)
          bash scripts/ci/explain.sh "bun run release" bun scripts/release.ts "$VERSION" $flags
      - name: Released version (for the npm job)
        id: released
        # After a real release package.json is the released version; a dry run undoes its bump, so
        # this is the current version and the npm job only packs it (npm publish --dry-run).
        run: echo "version=$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Where the zip is
        if: always()
        run: ls -la release/*.zip 2>/dev/null || true

  # npx/bunx launcher (packages/cli -> @pylotlight/surffish on npm), published only after the GitHub
  # release + Cask bump above succeeded. GitHub-hosted on purpose: npm trusted publishing (OIDC, no
  # NPM_TOKEN) doesn't support self-hosted runners. Gated by the repo variable NPM_PUBLISH=true so it
  # skips with a warning until the one-time npm setup is done (packages/cli/DEVELOPING.md#publishing).
  # Dry runs always stamp + `npm publish --dry-run` (no auth needed) so the job gets exercised.
  npm:
    name: "Surffish · Release · npm publish · ${{ needs.mac.outputs.version && format('v{0}', needs.mac.outputs.version) || inputs.version }}${{ inputs.dry_run && ' · dry run' || '' }}"
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      VERSION: ${{ needs.mac.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
      PKG: "@pylotlight/surffish"
    steps:
      - name: Publish or skip?
        id: gate
        run: |
          if [ -z "$VERSION" ]; then echo "::error::the mac job didn't report a version"; exit 1; fi
          if [ "$DRY_RUN" = "true" ]; then mode=dry
          elif [ "$NPM_PUBLISH" = "true" ]; then mode=publish
          else
            mode=skip
            echo "::warning::npm publish skipped: set the repo variable NPM_PUBLISH=true once ${PKG} exists on npm with release.yml as its trusted publisher (packages/cli/DEVELOPING.md#publishing)"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "npm: $mode ${PKG}@${VERSION}"
      - name: Checkout v${{ env.VERSION }} (plain git; main for a dry run)
        if: steps.gate.outputs.mode != 'skip'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          ref="refs/tags/v$VERSION"; [ "$DRY_RUN" = "true" ] && ref=refs/heads/main
          git init -q .
          git remote add origin "$REPO_URL"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
      - name: Node >= 22.14 and npm >= 11.5.1 (trusted publishing minimums; no setup-node since marketplace actions are off)
        if: steps.gate.outputs.mode != 'skip'
        run: |
          if ! node -e 'const [a,b]=process.versions.node.split(".").map(Number);process.exit(a>22||(a===22&&b>=14)?0:1)' 2>/dev/null; then
            dist=https://nodejs.org/dist/latest-v24.x
            curl -fsSL "$dist/SHASUMS256.txt" -o "$RUNNER_TEMP/SHASUMS256.txt"
            file="$(awk '/linux-x64\.tar\.xz$/ {print $2}' "$RUNNER_TEMP/SHASUMS256.txt")"
            curl -fsSL "$dist/$file" -o "$RUNNER_TEMP/$file"
            (cd "$RUNNER_TEMP" && grep " $file\$" SHASUMS256.txt | sha256sum -c -)
            mkdir -p "$RUNNER_TEMP/node" && tar -xJf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/node" --strip-components 1
            echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/node/bin:$PATH"
          fi
          if ! node -e 'const v=require("child_process").execSync("npm -v").toString().trim().split(".").map(Number);process.exit(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1)))?0:1)'; then
            # the runner's global prefix (/usr/local) isn't writable (EACCES on man5), so install into a user prefix
            prefix="$RUNNER_TEMP/npm-global"
            npm install -g --prefix "$prefix" --no-fund --no-audit npm@^11.5.1
            echo "$prefix/bin" >> "$GITHUB_PATH"
            export PATH="$prefix/bin:$PATH"
            hash -r
          fi
          echo "node $(node -v), npm $(npm -v)"
      - name: Stamp packages/cli (version + release.json with the zip's SHA-256)
        if: steps.gate.outputs.mode != 'skip'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node packages/cli/scripts/prepare-publish.mjs --version "$VERSION" --allow-missing
          else
            bash scripts/ci/explain.sh "npm - stamp packages/cli" node packages/cli/scripts/prepare-publish.mjs --version "$VERSION" --verify-download
          fi
          node packages/cli/bin/surffish.mjs --version
          node packages/cli/bin/surffish.mjs --help >/dev/null
      - name: npm publish ${{ env.PKG }}
        if: steps.gate.outputs.mode != 'skip'
        working-directory: packages/cli
        run: |
          tag=latest; case "$VERSION" in *-*) tag=next ;; esac
          if [ "$DRY_RUN" = "true" ]; then
            # a dry run re-packs the already released version; if npm refuses that, show the pack instead
            npm publish --dry-run --access public --tag "$tag" || { echo "::warning::npm publish --dry-run refused (version already on npm?), showing npm pack instead"; npm pack --dry-run; }
            exit 0
          fi
          # npm view needs no auth for a public package; failure = the package doesn't exist yet
          if ! npm view "$PKG" name >/dev/null 2>&1; then
            echo "::warning::${PKG} isn't on npm yet. Trusted publishing can only be set up on an existing package: do the one-time manual first publish (packages/cli/DEVELOPING.md#publishing); later releases then publish here."
            exit 0
          fi
          if [ "$(npm view "$PKG@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::${PKG}@${VERSION} is already on npm, nothing to do"
            exit 0
          fi
          bash ../../scripts/ci/explain.sh "npm publish" npm publish --provenance --access public --tag "$tag"
          echo "::notice::published ${PKG}@${VERSION} (npx ${PKG}@${VERSION})"
