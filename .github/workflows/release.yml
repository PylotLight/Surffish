name: release

# Manual only: Actions -> release -> Run workflow. Wraps `bun run release` on the self-hosted Mac.
# Needs docs/releases/vX.Y.Z.md committed first (the script stops and drafts one if missing).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'patch | minor | major | current | X.Y.Z'
        required: true
        default: patch
      dry_run:
        description: 'build + verify only, publish nothing'
        type: boolean
        default: true
      resume:
        description: 'finish a release whose tag is already on origin (bun run release --resume)'
        type: boolean
        default: false
      from_tag:
        description: 'build + publish the existing tag vVERSION (version = X.Y.Z) instead of main; implies resume'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Checkout main (plain git)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$url" || git remote add origin "$url"
          git fetch -q --tags origin main
          # the work dir persists between runs; an old shallow checkout breaks --resume's ancestry check
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch -q --unshallow --tags origin main; fi
          git checkout -q --force -B main origin/main
          git clean -qffdx -e node_modules
      - name: Bun (pinned to .bun-version, installed into ~/.bun if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$HOME/.bun/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
      - name: Bun only, no Node.js (node -> bun shim, runner externals/node* off PATH)
        run: bash scripts/ci/bun-as-node.sh
      - name: bun install (fails if any Node.js process runs)
        run: bash scripts/ci/watch-node.sh bun install
      - name: Git identity for the release commit + tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check the GitHub API route (SURFFISH_GH_PROXY, else fish ghp)
        # The Mac's network blocks non-enterprise GitHub API tokens on the direct route. With
        # SURFFISH_GH_PROXY in the runner's .env (e.g. socks5h://127.0.0.1:1080) release.ts makes its
        # REST calls with curl --proxy and the workflow token; otherwise it falls back to fish `ghp`.
        run: |
          if [ -n "${SURFFISH_GH_PROXY:-}" ]; then echo "SURFFISH_GH_PROXY present: yes (release.ts checks the API through it)"; exit 0; fi
          echo "SURFFISH_GH_PROXY not set, falling back to fish ghp"
          command -v gh || { echo "::error::set SURFFISH_GH_PROXY in the runner .env, or install gh + fish ghp"; exit 1; }
          command -v fish || { echo "::error::set SURFFISH_GH_PROXY in the runner .env, or install fish + ghp"; exit 1; }
          fish -c 'functions -q ghp' || { echo "::error::set SURFFISH_GH_PROXY in the runner .env, or add a ghp fish function for the runner user"; exit 1; }
      - name: bun run release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESUME: ${{ inputs.resume }}
          FROM_TAG: ${{ inputs.from_tag }}
          # only release.ts's own curl calls use it (named so electron-builder can't pick it up to publish)
          SURFFISH_GH_TOKEN: ${{ github.token }}
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          flags="--yes"
          [ "$DRY_RUN" = "true" ] && flags="$flags --dry-run"
          [ "$RESUME" = "true" ] && flags="$flags --resume"
          [ "$FROM_TAG" = "true" ] && flags="$flags --resume --from-tag"
          bun scripts/release.ts "$VERSION" $flags
      - name: Where the zip is
        if: always()
        run: ls -la release/*.zip 2>/dev/null || true
