name: Native macOS 26 build

on:
  # Manual only: avoid consuming Actions minutes on every native POC push.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check native browser source contracts
        run: |
          node --test \
            scripts/native-poc-ui-contract.test.cjs \
            scripts/native-poc-history-contract.test.cjs \
            scripts/native-poc-newtab-clock-contract.test.cjs \
            scripts/native-poc-toolchain-contract.test.cjs \
            scripts/native-poc-zoom-contract.test.cjs \
            scripts/native-poc-library-contract.test.cjs \
            scripts/native-poc-find-contract.test.cjs \
            scripts/native-poc-navigation-errors-contract.test.cjs
          node scripts/native-poc-lazy-restore-contract.test.cjs

      - name: Build native browser
        run: |
          chmod +x scripts/build-native-poc.sh
          ./scripts/build-native-poc.sh
