name: Native macOS 26 build

on:
  push:
    branches:
      - poc/native-webkit-app
      - fix/native-browser-polish-2026-11-25
    paths:
      - "poc-native/**"
      - "scripts/build-native-poc.sh"
      - ".github/workflows/native-macos-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build native browser
        run: |
          chmod +x scripts/build-native-poc.sh
          ./scripts/build-native-poc.sh
