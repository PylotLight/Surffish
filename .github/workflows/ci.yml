name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: Configure Electron SUID sandbox helper
        run: |
          helper="$(bun -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%U:%a' "$helper")" = "root:4755"
      - run: bun run typecheck
      - name: Install X11 input helper for native Electron tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xdotool
          command -v xdotool
      - name: Start D-Bus (silences Chromium bus spam)
        run: |
          sudo apt-get install --no-install-recommends -y dbus
          sudo mkdir -p /run/dbus
          sudo dbus-daemon --system --fork 2>/dev/null || true
          addr="$(dbus-daemon --session --fork --print-address=1 | head -1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$addr" >> "$GITHUB_ENV"
      - run: bun run test
      - run: bun run build
      - name: Smoke-test the Electron Downloads manager with synthetic transfers
        run: xvfb-run -a bun run test:electron-downloads
      - name: Probe native sidebar overlay bounds in the production Electron app
        run: xvfb-run -a bun run test:electron-sidebar-overlay
      - name: Smoke-test the full ad-filter engine (network, cosmetics, early scriptlets, iframes)
        run: xvfb-run -a bun run test:electron-adblock
      - name: Probe Electron extension compatibility
        run: xvfb-run -a bun run test:electron-extensions
      - name: Probe experimental host/frame bridge against inert loopback pages
        run: xvfb-run -a bun run test:electron-host-bridge

  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: Show Apple toolchain
        run: swift --version
      - name: Typecheck and run unit tests on macOS
        run: bun run typecheck && bun run test
      - name: Build Electron and the native AppKit trackpad bridge
        run: bun run build
      - name: Load the compiled native addon with Node
        run: bun -e "const addon = require('./out/native/mac-trackpad-swipe.node'); if (typeof addon.start !== 'function' || typeof addon.stop !== 'function') throw new Error('Native trackpad addon exports are missing')"
      - name: Run native WebKit API tests
        working-directory: src/native/macos
        run: swift test
      - name: Build native prototype
        working-directory: src/native/macos
        run: swift build
