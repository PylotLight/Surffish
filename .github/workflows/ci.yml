name: ci

# Runs on the self-hosted runners (k3s scale set + persistent Mac), so no hosted minutes.
# Uses no marketplace actions (repo only allows PylotLight actions).
# The repo is public: fork PRs never run here (they'd execute untrusted code on our boxes).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Casks/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Casks/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One Linux job per lane (was quick + overlay + 6 electron lanes = 8 pods). Each lane pays for
  # checkout + bun + install + build once, then runs its smoke suites two at a time on separate
  # Xvfb displays (every smoke uses its own temp profile and port 0, so they don't collide).
  linux:
    name: linux ${{ matrix.lane }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k3s-runners-surffish
    timeout-minutes: 30
    env:
      # Software rendering under xvfb is slower than a real GPU; smoke scripts honor this.
      SMOKE_WAIT_MS: 90000
    strategy:
      fail-fast: false
      matrix:
        include:
        # Longest suite first in each lane so it overlaps the short ones. Balanced from measured times
        # (Oct 2026: spinner-popover and the perf probe ~19 s each, the rest 1-10 s), ~55 suite-seconds
        # per lane, so each lane's smokes finish in ~30 s at two at a time.
        - lane: A
          unit: false
          tests: "test:electron-watchers-toggle test:electron-spinner-popover test:electron-downloads test:electron-safety test:electron-security test:electron-updates test:electron-table-stakes test:electron-command-palette test:electron-bookmarks test:electron-address-bar-sync"
        - lane: B
          unit: false
          tests: "test:electron-spaces test:electron-toolbar-popovers test:electron-multi-window test:electron-screenshot test:electron-split-view test:electron-sidebar-overlay test:electron-reader-watchers test:electron-network-tools test:electron-tab-archive test:electron-media-session test:electron-sqlite-store test:electron-sqlite-session"
        - lane: C
          unit: true
          tests: "test:electron-perf test:electron-pdf-editor test:electron-tab-groups test:electron-extensions test:electron-tab-selection test:electron-nav-errors test:electron-host-bridge test:electron-adblock test:electron-extension-dnr"
    steps:
      - name: Checkout (plain git, no third-party actions needed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
          git fetch -q --no-tags --depth 1 origin "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx -e node_modules -e src/native/macos/.build
      # Set SURFFISH_CI_CACHE on the runner (or mount a writable /cache) to keep bun, its package
      # cache and the Electron zip across ephemeral pods. Without it nothing changes.
      - name: Persistent caches (bun, bun install cache, Electron), only if the runner mounts one
        run: |
          dir="${SURFFISH_CI_CACHE:-}"
          if [ -z "$dir" ] && [ -d /cache ] && [ -w /cache ]; then dir=/cache/surffish; fi
          if [ -n "$dir" ] && mkdir -p "$dir" 2>/dev/null && [ -w "$dir" ]; then
            echo "using persistent cache at $dir"
            {
              echo "BUN_INSTALL=$dir/bun"
              echo "BUN_INSTALL_CACHE_DIR=$dir/bun-install-cache"
              echo "ELECTRON_CACHE=$dir/electron"
            } >> "$GITHUB_ENV"
          else
            echo "no persistent cache mounted, everything downloads fresh"
            echo "BUN_INSTALL=$HOME/.bun" >> "$GITHUB_ENV"
          fi
      - name: Bun (pinned to .bun-version, installed into $BUN_INSTALL if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$BUN_INSTALL/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          "$BUN_INSTALL/bin/bun" --version
      - name: Bun only, no Node.js (node -> bun shim, runner externals/node* off PATH)
        run: bash scripts/ci/bun-as-node.sh
      - name: bun install (fails if any Node.js process runs)
        run: bash scripts/ci/watch-node.sh bun install
      - name: Electron SUID sandbox helper (needs passwordless sudo, else run unsandboxed)
        run: |
          helper="$(bun -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          if sudo -n true 2>/dev/null; then
            sudo chown root:root "$helper" && sudo chmod 4755 "$helper"
          else
            echo "::warning::no passwordless sudo on this runner, Electron tests run with ELECTRON_DISABLE_SANDBOX=1"
            echo "ELECTRON_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"
          fi
      - name: Check xvfb + system deps (baked into the runner image)
        run: |
          missing=""
          for tool in xvfb-run xdotool dbus-daemon flock; do command -v "$tool" >/dev/null || missing="$missing $tool"; done
          for soname in libnspr4.so libnss3.so libatk-1.0.so.0 libatk-bridge-2.0.so.0 libcups.so.2 libdrm.so.2 libxkbcommon.so.0 libXcomposite.so.1 libXdamage.so.1 libXfixes.so.3 libXrandr.so.2 libgbm.so.1 libpango-1.0.so.0 libcairo.so.2 libasound.so.2 libgtk-3.so.0 libXss.so.1 libXtst.so.6 libatspi.so.0; do ldconfig -p | grep -q "$soname" || missing="$missing $soname"; done
          [ -z "$missing" ] || { echo "::error::runner image is missing:$missing (rebuild arc-runner)"; exit 1; }
      - name: Typecheck
        if: matrix.unit
        run: bun run typecheck
      - name: Unit tests
        if: matrix.unit
        run: bun run test
      - name: Start D-Bus (silences Chromium bus spam in containers)
        run: |
          sudo mkdir -p /run/dbus
          sudo dbus-daemon --system --fork 2>/dev/null || true
          addr="$(dbus-daemon --session --fork --print-address=1 | head -1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$addr" >> "$GITHUB_ENV"
      - run: bun run build
      - name: Run lane ${{ matrix.lane }} suites (2 at a time)
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-logs"
          # The pod runs Chromium's user-namespace sandbox (the setuid helper can't work in it), and from
          # inside that sandbox the browser may not lower a renderer's oom_score_adj, so Chromium logs
          # "Failed to adjust OOM score of renderer" for every renderer (~260 lines a run). It is
          # harmless here (it only affects which process the kernel kills first under memory pressure),
          # and running the smokes unsandboxed to silence it would stop testing the real sandbox, so the
          # lines are dropped from the printed logs and counted instead. Nothing else is filtered.
          OOM_NOISE='zygote_host_impl_linux.cc:[0-9]*\] Failed to adjust OOM score of renderer'
          export OOM_NOISE
          run_one() {
            display="$1" t="$2" log="$RUNNER_TEMP/smoke-logs/$2.log"
            start=$(date +%s)
            if xvfb-run -n "$display" bun run "$t" >"$log" 2>&1; then status=ok; else status=FAILED; fi
            secs=$(( $(date +%s) - start ))
            oom=$(grep -c "$OOM_NOISE" "$log" || true)
            # one suite's log at a time, so parallel output never interleaves
            flock "$RUNNER_TEMP/smoke-logs/.print" sh -c "echo '::group::$status $t (${secs}s)'; grep -v \"\$OOM_NOISE\" '$log'; [ '$oom' = 0 ] || echo '($oom sandbox OOM-score lines hidden, see ci.yml)'; echo '::endgroup::'"
            echo "$oom" >"$log.oom"
            [ "$status" = ok ] || { echo "::error::$t failed"; return 1; }
          }
          export -f run_one
          i=0
          set +e
          for t in $TESTS; do echo "$((100 + i)) $t"; i=$((i + 1)); done \
            | xargs -P 2 -L 1 bash -c 'run_one "$0" "$1"'
          status=$?
          echo "hidden sandbox OOM-score lines this lane: $(cat "$RUNNER_TEMP"/smoke-logs/*.oom 2>/dev/null | awk '{ n += $1 } END { print n + 0 }')"
          exit $status

  # Per-PR perf regression check (docs/perf.md). Builds the PR (merge commit) and its base on the
  # same pod, runs scripts/perf/bench.cjs on each, interleaved, and compares medians. Its own job,
  # so it runs in parallel with the lanes. On push to main it compares against the previous main.
  perf:
    name: perf (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k3s-runners-surffish
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      PERF_RUNS: 3
    steps:
      - name: Checkout PR and its base (plain git, no third-party actions needed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
          git fetch -q --no-tags --depth 1 origin "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx -e node_modules -e src/native/macos/.build
          base="$RUNNER_TEMP/perf-base"
          git worktree prune; rm -rf "$base"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git fetch -q --no-tags --depth 1 origin "$BASE_SHA"; then
            git worktree add -q --detach "$base" FETCH_HEAD
            echo "PERF_BASE=$base" >> "$GITHUB_ENV"
            echo "comparing $SHA against base $BASE_SHA"
          else
            echo "::warning::no base commit to compare against, perf runs on this commit only"
          fi
      - name: Persistent caches (bun, bun install cache, Electron), only if the runner mounts one
        run: |
          dir="${SURFFISH_CI_CACHE:-}"
          if [ -z "$dir" ] && [ -d /cache ] && [ -w /cache ]; then dir=/cache/surffish; fi
          if [ -n "$dir" ] && mkdir -p "$dir" 2>/dev/null && [ -w "$dir" ]; then
            { echo "BUN_INSTALL=$dir/bun"; echo "BUN_INSTALL_CACHE_DIR=$dir/bun-install-cache"; echo "ELECTRON_CACHE=$dir/electron"; } >> "$GITHUB_ENV"
          else
            echo "BUN_INSTALL=$HOME/.bun" >> "$GITHUB_ENV"
          fi
      - name: Bun (pinned to .bun-version, installed into $BUN_INSTALL if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$BUN_INSTALL/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
      - name: Bun only, no Node.js (node -> bun shim, runner externals/node* off PATH)
        run: bash scripts/ci/bun-as-node.sh
      # Docs, CI config, smokes and unit tests can't move the numbers (both sides would bench identical
      # code), so those changes skip the ~2 min bench. Anything else, or a manual run, benches.
      - name: Skip the bench when nothing that reaches the app or the bench changed
        if: env.PERF_BASE && github.event_name != 'workflow_dispatch'
        env:
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! bun scripts/perf/app-changed.ts "$BASE_SHA" "$SHA"; then
            echo "PERF_SKIP=1" >> "$GITHUB_ENV"
            { echo "### Perf check (linux): skipped"; echo; echo "No change here reaches the built app, its dependencies or the bench (scripts/perf/app-changed.ts), so main and this commit would run identical code."; } > "$RUNNER_TEMP/perf.md"
            cat "$RUNNER_TEMP/perf.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sticky PR comment for a skipped bench
        if: env.PERF_SKIP == '1' && github.event.pull_request.number
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/perf/post-comment.ts linux "$RUNNER_TEMP/perf.md"
      - name: bun install (fails if any Node.js process runs)
        if: env.PERF_SKIP != '1'
        run: bash scripts/ci/watch-node.sh bun install
      - name: Install base deps (reuses the PR's node_modules when the dependencies match)
        if: env.PERF_BASE && env.PERF_SKIP != '1'
        run: |
          if bun scripts/perf/same-deps.ts . "$PERF_BASE"; then
            ln -s "$PWD/node_modules" "$PERF_BASE/node_modules"
          else
            (cd "$PERF_BASE" && bash "$GITHUB_WORKSPACE/scripts/ci/watch-node.sh" bun install)
          fi
      - name: Electron SUID sandbox helper (needs passwordless sudo, else run unsandboxed)
        if: env.PERF_SKIP != '1'
        run: |
          helper="$(bun -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          if sudo -n true 2>/dev/null; then sudo chown root:root "$helper" && sudo chmod 4755 "$helper"; else echo "ELECTRON_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"; fi
      - name: Start D-Bus (silences Chromium bus spam in containers)
        if: env.PERF_SKIP != '1'
        run: |
          sudo mkdir -p /run/dbus
          sudo dbus-daemon --system --fork 2>/dev/null || true
          addr="$(dbus-daemon --session --fork --print-address=1 | head -1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$addr" >> "$GITHUB_ENV"
      - name: Perf unit tests
        if: env.PERF_SKIP != '1'
        run: bun run test:perf
      - name: Build PR and base
        if: env.PERF_SKIP != '1'
        run: |
          bun run build >"$RUNNER_TEMP/build-pr.log" 2>&1 & pr=$!
          if [ -n "${PERF_BASE:-}" ]; then (cd "$PERF_BASE" && bun run build) >"$RUNNER_TEMP/build-base.log" 2>&1 & base=$!; fi
          ok=0
          wait $pr || { echo "::error::PR build failed"; cat "$RUNNER_TEMP/build-pr.log"; ok=1; }
          if [ -n "${base:-}" ]; then wait $base || { echo "::error::base build failed"; cat "$RUNNER_TEMP/build-base.log"; ok=1; }; fi
          exit $ok
      - name: Bench (PR vs base, interleaved)
        if: env.PERF_SKIP != '1'
        run: |
          apps="--app pr=."
          [ -n "${PERF_BASE:-}" ] && apps="--app main=$PERF_BASE $apps"
          xvfb-run -a -s "-screen 0 1600x1000x24" bun run perf $apps --out "$RUNNER_TEMP/perf.json"
      - name: Compare, step summary and sticky PR comment
        if: env.PERF_BASE && env.PERF_SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          bun run perf:compare "$RUNNER_TEMP/perf.json" --base main --head pr --title "Perf check (linux)" --markdown "$RUNNER_TEMP/perf.md" >/dev/null
          status=$?
          cat "$RUNNER_TEMP/perf.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/perf.md"
          if [ -n "$PR_NUMBER" ]; then bun scripts/perf/post-comment.ts linux "$RUNNER_TEMP/perf.md"; fi
          [ "$status" = 0 ] || echo "::error::perf regression beyond the thresholds in scripts/perf/perf.config.json (see the table above)"
          exit $status

  # The Mac jobs keep out/native between runs (git clean -e out/native): the trackpad addon and the
  # Google sign-in helper are fingerprinted (source, flags, toolchain; scripts/native-build-cache.ts),
  # so an unchanged one is reused (~20 s of clang/swiftc per Mac job) and a changed one is rebuilt.
  native-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout (plain git, no third-party actions needed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx -e node_modules -e src/native/macos/.build -e out/native
      - name: Bun (pinned to .bun-version, installed into ~/.bun if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$HOME/.bun/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
      - name: Bun only, no Node.js (node -> bun shim, runner externals/node* off PATH)
        run: bash scripts/ci/bun-as-node.sh
      - name: bun install (fails if any Node.js process runs)
        run: bash scripts/ci/watch-node.sh bun install
      - run: swift --version
      - name: Typecheck and unit tests on macOS
        run: bun run typecheck && bun run test
      - name: Build Electron and the native AppKit trackpad bridge
        run: bun run build
      - name: Load the compiled native addon
        run: bun -e "const addon = require('./out/native/mac-trackpad-swipe.node'); if (typeof addon.start !== 'function' || typeof addon.stop !== 'function') throw new Error('Native trackpad addon exports are missing')"
      - name: Native WebKit API tests
        working-directory: src/native/macos
        run: swift test
      - name: Build native prototype
        working-directory: src/native/macos
        run: swift build

  # Core Electron smokes on real macOS (no xvfb). The sidebar-overlay smoke drives the cursor with
  # xdotool, so it stays Linux-only. Same install path as native-macos. Set the repo variable
  # SURFFISH_MAC_CI=label to run it on PRs only when they carry the `mac` label (main always runs).
  macos-smoke:
    name: macos smoke
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || vars.SURFFISH_MAC_CI != 'label' || contains(github.event.pull_request.labels.*.name, 'mac'))
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Hidden smoke mode v2 (scripts/smoke-hidden.cjs): the runner is someone's laptop in use, so no
      # Dock icon and windows are never put on screen or focused (they keep rendering). "1" is the
      # older near-invisible mode (windows on screen at 1% opacity), kept as a fallback.
      SURFFISH_SMOKE_HIDDEN: "2"
    steps:
      - name: Checkout (plain git, no third-party actions needed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx -e node_modules -e src/native/macos/.build -e out/native
      - name: Bun (pinned to .bun-version, installed into ~/.bun if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$HOME/.bun/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Bun only, no Node.js (node -> bun shim, runner externals/node* off PATH)
        run: bash scripts/ci/bun-as-node.sh
      - name: bun install (fails if any Node.js process runs)
        run: bash scripts/ci/watch-node.sh bun install
      - run: bun run build
      - name: Screen watcher (scripts/ci/window-watch.swift; the smokes run without it if it doesn't build)
        run: swiftc -O -o "$RUNNER_TEMP/window-watch" scripts/ci/window-watch.swift || echo "::warning::window-watch did not build; no external on-screen check"
      - name: Core Electron smokes (2 at a time)
        env:
          TESTS: "test:electron-security test:electron-table-stakes test:electron-multi-window test:electron-tab-groups test:electron-split-view test:electron-adblock test:electron-nav-errors"
          # Smokes that need real windows (SURFFISH_SMOKE_HIDDEN=0). None at the moment.
          VISIBLE_TESTS: ""
        run: |
          export logs="$RUNNER_TEMP/smoke-logs"; mkdir -p "$logs"
          # Samples the screen while the smokes run: any on-screen window of an "Electron" process, or
          # one becoming the frontmost app, is a warning (a dev Electron app of the user's counts too).
          watch="$RUNNER_TEMP/window-watch"; wpid=""
          if [ -x "$watch" ]; then "$watch" Electron 200 >"$logs/window-watch.log" 2>&1 & wpid=$!; fi
          printf '%s\n' $TESTS | xargs -P 2 -I{} sh -c 'case " $VISIBLE_TESTS " in *" $1 "*) export SURFFISH_SMOKE_HIDDEN=0;; esac; s=$(date +%s); bun run "$1" >"$logs/$1.log" 2>&1; echo "$? $(( $(date +%s) - s ))" >"$logs/$1.status"' _ {}
          if [ -n "$wpid" ]; then
            kill -TERM "$wpid" 2>/dev/null; wait "$wpid" 2>/dev/null || true
            echo "::group::screen watcher"; cat "$logs/window-watch.log"; echo "::endgroup::"
            if grep -q 'ON SCREEN\|TOOK FOCUS' "$logs/window-watch.log"; then echo "::warning::an Electron window was on screen or took focus during the smokes (see the screen watcher group)"; fi
          fi
          failed=0
          for t in $TESTS; do
            read -r code secs < "$logs/$t.status"
            [ "$code" = 0 ] && st=ok || { st=FAILED; failed=1; echo "::error::$t failed on macOS"; }
            echo "::group::$st $t (${secs}s)"; cat "$logs/$t.log"; echo "::endgroup::"
          done
          exit $failed

  # Perf check on the Mac runner (real GPU, macOS memory accounting), opt-in. The machine is in use, so
  # timing/memory only warn here (perf.config.json platforms.darwin); deterministic metrics can fail.
  # Results go to the step summary; with SURFFISH_GH_PROXY set in the runner's .env they are also
  # posted to the PR as a sticky comment through that proxy (only those curl calls use it).
  perf-macos:
    name: perf (macos)
    # Opt-in only: a PR with the `perf-mac` label, or a manual workflow_dispatch run.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'perf-mac'))
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PERF_RUNS: 3
      # Never-shown windows (v2), but only views that would be on screen are kept rendering, so
      # background tabs are throttled like in a visible window and the idle/background CPU numbers hold.
      SURFFISH_SMOKE_HIDDEN: "2"
      SURFFISH_SMOKE_HIDDEN_THROTTLE: visible
    steps:
      - name: Checkout PR and its base (plain git, no third-party actions needed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
          git fetch -q --no-tags --depth 1 origin "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx -e node_modules -e src/native/macos/.build -e out/native
          base="$RUNNER_TEMP/perf-base"
          git worktree prune; rm -rf "$base"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git fetch -q --no-tags --depth 1 origin "$BASE_SHA"; then
            git worktree add -q --detach "$base" FETCH_HEAD
            echo "PERF_BASE=$base" >> "$GITHUB_ENV"
          else
            echo "::warning::no base commit to compare against, perf runs on this commit only"
          fi
      - name: Bun (pinned to .bun-version, installed into ~/.bun if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$HOME/.bun/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Bun only, no Node.js (node -> bun shim, runner externals/node* off PATH)
        run: bash scripts/ci/bun-as-node.sh
      - name: bun install (fails if any Node.js process runs)
        run: bash scripts/ci/watch-node.sh bun install
      # Never a second bun install / install-electron on the Mac (corporate endpoint protection
      # flags it). The base shares the PR's node_modules or isn't compared at all.
      - name: Base deps (share the PR's node_modules, else skip the comparison)
        if: env.PERF_BASE
        run: |
          if bun scripts/perf/same-deps.ts . "$PERF_BASE"; then
            ln -s "$PWD/node_modules" "$PERF_BASE/node_modules"
          else
            echo "::warning::dependencies differ from the base, so perf (macos) only runs this PR's build (no comparison)"
            echo "### Perf check (macOS): no comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR changes dependencies (bun.lock or package.json), and the Mac runner never runs a second install, so the base wasn't benched. See the Linux perf check." >> "$GITHUB_STEP_SUMMARY"
            echo "PERF_BASE=" >> "$GITHUB_ENV"
          fi
      - name: GitHub API proxy check (presence and HTTP status only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${SURFFISH_GH_PROXY:-}" ]; then echo "SURFFISH_GH_PROXY present: no (results go to the step summary only)"; exit 0; fi
          echo "SURFFISH_GH_PROXY present: yes"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --proxy "$SURFFISH_GH_PROXY" -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" || true)"
          echo "GET /repos/$GITHUB_REPOSITORY through the proxy: HTTP $code"
      - name: Build PR and base (base reuses the PR's native addons, which this check doesn't measure)
        run: |
          bun run build
          if [ -n "${PERF_BASE:-}" ]; then
            (cd "$PERF_BASE" && bunx electron-vite build)
            [ -d out/native ] && mkdir -p "$PERF_BASE/out" && cp -R out/native "$PERF_BASE/out/"
          fi
      - name: Bench (PR vs base, interleaved)
        run: |
          apps="--app pr=."
          [ -n "${PERF_BASE:-}" ] && apps="--app main=$PERF_BASE $apps"
          bun run perf $apps --out "$RUNNER_TEMP/perf.json"
      - name: Compare, step summary and (via SURFFISH_GH_PROXY) sticky PR comment
        if: env.PERF_BASE
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          bun run perf:compare "$RUNNER_TEMP/perf.json" --base main --head pr --title "Perf check (macOS)" --markdown "$RUNNER_TEMP/perf.md" >/dev/null
          status=$?
          cat "$RUNNER_TEMP/perf.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/perf.md"
          if [ -n "$PR_NUMBER" ] && [ -n "${SURFFISH_GH_PROXY:-}" ]; then
            GH_PROXY="$SURFFISH_GH_PROXY" bun scripts/perf/post-comment.ts macos "$RUNNER_TEMP/perf.md"
          else
            echo "no PR comment from the Mac runner (no SURFFISH_GH_PROXY or not a PR)"
          fi
          [ "$status" = 0 ] || echo "::error::perf regression beyond the thresholds in scripts/perf/perf.config.json (see the table above)"
          exit $status
