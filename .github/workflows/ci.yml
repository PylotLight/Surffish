name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: Configure Electron SUID sandbox helper
        run: |
          helper="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%U:%a' "$helper")" = "root:4755"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Smoke-test the Electron Downloads manager with synthetic transfers
        run: xvfb-run -a bun run test:electron-downloads
      - name: Probe Electron extension compatibility
        run: xvfb-run -a bun run test:electron-extensions
      - name: Probe experimental host/frame bridge against inert loopback pages
        run: xvfb-run -a bun run test:electron-host-bridge

  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: swift --version
      - name: Run native WebKit API tests
        working-directory: native/macos
        run: swift test
      - name: Build native prototype
        working-directory: native/macos
        run: swift build
