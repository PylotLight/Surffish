name: ci

# Runs on the self-hosted runners (k3s scale set + persistent Mac), so no hosted minutes.
# Uses no marketplace actions (repo only allows PylotLight actions).
# The repo is public: fork PRs never run here (they'd execute untrusted code on our boxes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k3s-runners-surffish
    timeout-minutes: 45
    env:
      # Software rendering under xvfb is slower than a real GPU; smoke scripts honor this.
      SMOKE_WAIT_MS: 90000
    steps:
      - name: Checkout (plain git, no third-party actions needed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx -e node_modules -e src/native/macos/.build
      - name: Bun (pinned to .bun-version, installed into ~/.bun if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$HOME/.bun/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
      - run: bun install
      - name: Electron SUID sandbox helper (needs passwordless sudo, else run unsandboxed)
        run: |
          helper="$(bun -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          if sudo -n true 2>/dev/null; then
            sudo chown root:root "$helper" && sudo chmod 4755 "$helper"
          else
            echo "::warning::no passwordless sudo on this runner, Electron tests run with ELECTRON_DISABLE_SANDBOX=1"
            echo "ELECTRON_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"
          fi
      - name: Check xvfb + system deps
        run: |
          missing=""
          for tool in xvfb-run xdotool; do command -v "$tool" >/dev/null || missing="$missing $tool"; done
          if sudo -n true 2>/dev/null; then
            sudo apt-get update
            [ -z "$missing" ] || sudo apt-get install --no-install-recommends -y xvfb xdotool
            # Electron runtime libs missing from the ARC runner image (ubuntu-latest has them baked in)
            sudo apt-get install --no-install-recommends -y libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libgtk-3-0 libxss1 libxtst6 libatspi2.0-0 || \
            sudo apt-get install --no-install-recommends -y libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libgtk-3-0 libxss1 libxtst6 libatspi2.0-0
          else
            echo "::error::runner is missing:$missing and no passwordless sudo"; exit 1
          fi
      - name: Start D-Bus (silences Chromium bus spam in containers)
        run: |
          sudo apt-get install --no-install-recommends -y dbus
          sudo mkdir -p /run/dbus
          sudo dbus-daemon --system --fork 2>/dev/null || true
          addr="$(dbus-daemon --session --fork --print-address=1 | head -1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$addr" >> "$GITHUB_ENV"
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: xvfb-run -a bun run test:electron-security
      - run: xvfb-run -a bun run test:electron-downloads
      - run: xvfb-run -a bun run test:electron-table-stakes
      - run: xvfb-run -a bun run test:electron-safety
      - run: xvfb-run -a bun run test:electron-updates
      - run: xvfb-run -a bun run test:electron-command-palette
      - run: xvfb-run -a bun run test:electron-bookmarks
      - run: xvfb-run -a bun run test:electron-multi-window
      - run: xvfb-run -a bun run test:electron-tab-archive
      - run: xvfb-run -a bun run test:electron-screenshot
      - run: xvfb-run -a bun run test:electron-network-tools
      - run: xvfb-run -a bun run test:electron-reader-watchers
      - run: xvfb-run -a bun run test:electron-split-view
      - run: xvfb-run -a bun run test:electron-spaces
      - run: xvfb-run -a bun run test:electron-tab-groups
      - run: xvfb-run -a bun run test:electron-nav-errors
      - run: xvfb-run -a bun run test:electron-perf
      - run: xvfb-run -a bun run test:electron-pdf-editor
      - run: xvfb-run -a bun run test:electron-adblock
      - run: xvfb-run -a bun run test:electron-extensions
      - run: xvfb-run -a bun run test:electron-host-bridge
      - name: Sidebar overlay probe (known failing on main, non-blocking)
        continue-on-error: true
        run: xvfb-run -a bun run test:electron-sidebar-overlay

  native-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - name: Checkout (plain git, no third-party actions needed)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 && git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q --force FETCH_HEAD
          git clean -qffdx -e node_modules -e src/native/macos/.build
      - name: Bun (pinned to .bun-version, installed into ~/.bun if missing)
        run: |
          want="$(tr -d ' \nv' < .bun-version)"
          export PATH="$HOME/.bun/bin:$PATH"
          if [ "$(bun --version 2>/dev/null)" != "$want" ]; then curl -fsSL https://bun.sh/install | bash -s "bun-v$want"; fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
      - run: bun install
      - run: swift --version
      - name: Typecheck and unit tests on macOS
        run: bun run typecheck && bun run test
      - name: Build Electron and the native AppKit trackpad bridge
        run: bun run build
      - name: Load the compiled native addon
        run: bun -e "const addon = require('./out/native/mac-trackpad-swipe.node'); if (typeof addon.start !== 'function' || typeof addon.stop !== 'function') throw new Error('Native trackpad addon exports are missing')"
      - name: Native WebKit API tests
        working-directory: src/native/macos
        run: swift test
      - name: Build native prototype
        working-directory: src/native/macos
        run: swift build
